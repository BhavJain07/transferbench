[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "transferbench"
version = "0.1.0"
description = "A generalization benchmark for AI safety claims, built on Inspect AI"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "inspect-ai>=0.3.263,<0.4",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "polars>=1.20,<2",
  "duckdb>=1.2,<2",
  "pyarrow>=19,<24",
  "plotly>=6,<7",
  "pyyaml>=6,<7",
  "numpy>=2,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
providers = ["anthropic>=0.49", "openai>=1.66", "google-genai>=1"]
agentdojo = ["agentdojo==0.1.35"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
transferbench = "transferbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["transferbench"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "transferbench/_configs"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
